<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="FCP logo">
  <defs>
    <radialGradient id="eye" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#EEEDF7"/>
      <stop offset="1" stop-color="#C9CDEB"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F2A"/>
      <stop offset="1" stop-color="#10163A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B3A7A"/>
      <stop offset="0.5" stop-color="#1C2556"/>
      <stop offset="1" stop-color="#232E66"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <circle cx="100" cy="100" r="96" fill="#1B2350"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#252F66" stroke-width="4"/>

  <!-- long visor slot -->
  <rect x="16" y="74" width="168" height="52" rx="26" fill="url(#visor)" stroke="#9AA3D9" stroke-width="3"/>
  <!-- glass inside the slot -->
  <rect x="24" y="81" width="152" height="38" rx="19" fill="url(#glass)"/>

  <!-- oval + line touching the wall, both ends -->
  <ellipse cx="44" cy="100" rx="7" ry="13" fill="none" stroke="#9AA3D9" stroke-width="2.5"/>
  <line x1="37" y1="100" x2="24" y2="100" stroke="#9AA3D9" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="156" cy="100" rx="7" ry="13" fill="none" stroke="#9AA3D9" stroke-width="2.5"/>
  <line x1="163" y1="100" x2="176" y2="100" stroke="#9AA3D9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- eyes, with a soft glow -->
  <circle cx="80" cy="101" r="12" fill="#EEEDF7" opacity="0.14"/>
  <circle cx="120" cy="101" r="12" fill="#EEEDF7" opacity="0.14"/>
  <circle cx="80" cy="101" r="7.5" fill="url(#eye)"/>
  <circle cx="120" cy="101" r="7.5" fill="url(#eye)"/>

  <!-- two little dots at the top, between the eyes -->
  <circle cx="95" cy="86" r="2.4" fill="#EEEDF7"/>
  <circle cx="105" cy="86" r="2.4" fill="#EEEDF7"/>
</svg>
