<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="FCP logo">
  <defs>
    <radialGradient id="eye" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#EEEDF7"/>
      <stop offset="1" stop-color="#C9CDEB"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10163A"/>
      <stop offset="1" stop-color="#0A0F2A"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <circle cx="100" cy="100" r="96" fill="#1B2350"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#252F66" stroke-width="4"/>

  <!-- visor window -->
  <rect x="34" y="70" width="132" height="60" rx="30" fill="url(#visor)" stroke="#9AA3D9" stroke-width="3"/>

  <!-- side lines -->
  <line x1="54" y1="86" x2="54" y2="114" stroke="#9AA3D9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="146" y1="86" x2="146" y2="114" stroke="#9AA3D9" stroke-width="3.5" stroke-linecap="round"/>

  <!-- eyes, with a soft glow -->
  <circle cx="78" cy="100" r="15" fill="#EEEDF7" opacity="0.12"/>
  <circle cx="122" cy="100" r="15" fill="#EEEDF7" opacity="0.12"/>
  <circle cx="78" cy="100" r="10" fill="url(#eye)"/>
  <circle cx="122" cy="100" r="10" fill="url(#eye)"/>

  <!-- little dots, top and bottom -->
  <circle cx="100" cy="79" r="3.2" fill="#EEEDF7"/>
  <circle cx="100" cy="121" r="3.2" fill="#EEEDF7"/>
  <circle cx="100" cy="56" r="3" fill="#FFD24A"/>
  <circle cx="100" cy="144" r="3" fill="#9AA3D9"/>
</svg>
